  <script>
    (function () {
      try {
        var preferencia = localStorage.getItem('nexus-tema');
        if (preferencia !== 'oscuro' && preferencia !== 'claro') {
          preferencia = window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        }
        document.documentElement.dataset.theme = preferencia;
      } catch (error) {
        document.documentElement.dataset.theme = 'oscuro';
      }
    })();
  </script>
